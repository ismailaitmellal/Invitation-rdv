<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Une petite question</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: tendre, joueur, un peu théâtral
   IDEA: une lettre d'invitation scellée d'un cœur, que chacun peut écrire
   PICTURE: grand cœur-enveloppe SVG qui bat, cœurs qui flottent derrière
   COLOUR and TYPE: framboise #e0245e, rose poudré, nuit prune ; DM Serif Display + Nunito
   LAYOUT: une carte centrée, une colonne calme, gros bouton Oui */
:root{color-scheme:light dark;
  --bg:light-dark(#ffe6ee,#1d0f17);--card:light-dark(#fff,#2a1622);--ink:light-dark(#3a1024,#ffe6ee);
  --soft:light-dark(#8a4a64,#d9a6bb);--acc:#e0245e;--acc2:light-dark(#ffc2d4,#5a2440);--line:light-dark(#f6c9d8,#4a2537)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,var(--acc2),var(--bg) 70%) fixed;color:var(--ink);
  font:17px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip;display:grid;place-items:center;padding:20px 14px;min-height:100dvh;
  -webkit-tap-highlight-color:transparent}
#amb{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#amb i{position:absolute;bottom:-60px;opacity:.18;animation:drift linear infinite}
@keyframes drift{to{transform:translate(var(--dx),-120vh) rotate(var(--r))}}
.card{width:min(560px,100%);background:var(--card);border-radius:28px;padding:clamp(22px,5vw,40px);z-index:1;
  box-shadow:0 30px 60px -30px rgba(160,20,70,.45),0 0 0 1px var(--line);text-align:center;position:relative}
.screen{display:none}.screen.on{display:block;animation:in .5s ease}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1,h2{font-family:"DM Serif Display",Georgia,serif;font-weight:400;line-height:1.08;text-wrap:balance;margin:.2em 0 .35em}
h1{font-size:clamp(30px,7vw,44px)}h2{font-size:clamp(26px,6vw,36px)}
h1 em,h2 em{color:var(--acc)}
p.lead{color:var(--soft);margin:0 auto 22px;max-width:40ch}
.heart{width:min(210px,52vw);height:auto;display:block;margin:0 auto 6px;animation:beat 1.6s ease-in-out infinite;transform-origin:50% 60%}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.08)}24%{transform:scale(.98)}36%{transform:scale(1.05)}}
.btns{display:flex;gap:16px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:120px}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;min-height:44px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.act:focus-within,.seg label:focus-within{outline:3px solid var(--acc);outline-offset:3px}
#yes{background:var(--acc);color:#fff;font-weight:800;font-size:calc(22px * var(--g,1));padding:calc(16px * var(--g,1)) calc(44px * var(--g,1));
  animation:glow 1.8s ease-in-out infinite;transition:transform .2s,font-size .3s,padding .3s;position:relative}
@keyframes glow{0%,100%{box-shadow:0 12px 24px -10px rgba(224,36,94,.7),0 0 0 0 rgba(224,36,94,.45)}50%{box-shadow:0 12px 24px -10px rgba(224,36,94,.7),0 0 0 14px rgba(224,36,94,0)}}
#yes:hover{transform:scale(1.05)}
#no{color:var(--soft);border:2px solid var(--line);font-weight:600;font-size:15px;padding:8px 18px;white-space:nowrap;z-index:20;background:var(--card);touch-action:none;user-select:none;-webkit-user-select:none}
#no.run{position:fixed;margin:0}
#no.blink{animation:blink .18s ease}
@keyframes blink{from{transform:scale(.6);opacity:.4}to{transform:none;opacity:1}}
#no.gone{opacity:0;transform:scale(.2) rotate(30deg);pointer-events:none;transition:.35s}
.hint{font-size:13px;color:var(--soft);min-height:20px;margin-top:8px}
form{text-align:start;display:grid;gap:18px;margin-top:8px}
label.f{display:grid;gap:6px;font-weight:600}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;min-height:48px}
textarea{min-height:80px;resize:vertical}
fieldset{border:0;padding:0;margin:0}legend{font-weight:600;margin-bottom:8px}
.small{font-size:13px;color:var(--soft);font-weight:400}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{position:relative;flex:1 1 0;text-align:center;border:1.5px solid var(--line);border-radius:999px;padding:10px 12px;cursor:pointer;font-weight:600;background:var(--bg);min-height:44px;white-space:nowrap}
.seg input{position:absolute;opacity:0;inset:0;min-height:0;cursor:pointer}
.seg label:has(input:checked){background:var(--acc);border-color:var(--acc);color:#fff}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.act{position:relative;border:1.5px solid var(--line);border-radius:16px;padding:12px 6px 10px;text-align:center;cursor:pointer;background:var(--bg);transition:.2s;font-size:14px;font-weight:600;line-height:1.25}
.act input{position:absolute;opacity:0;inset:0;cursor:pointer;min-height:0}
.act svg{width:30px;height:30px;display:block;margin:0 auto 6px;stroke:var(--acc);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.act:has(input:checked){background:var(--acc);color:#fff;border-color:var(--acc);transform:translateY(-2px)}
.act:has(input:checked) svg{stroke:#fff}
.hide{display:none!important}
.add{display:flex;gap:8px;margin-top:12px}.add input{flex:1}.add button{flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chips:empty{display:none}
.chip{background:var(--acc);color:#fff;border-radius:999px;padding:4px 4px 4px 14px;display:inline-flex;gap:6px;align-items:center;font-weight:600;font-size:14px;animation:in .3s ease}
.chip button{background:rgba(255,255,255,.25);color:#fff;width:32px;height:32px;min-height:32px;padding:0;font-size:18px;line-height:1}
.chk{display:flex;gap:10px;align-items:center;margin-top:14px;font-weight:600;cursor:pointer}
.chk input{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--acc)}
.main{background:var(--acc);color:#fff;font-weight:800;font-size:19px;padding:16px;width:100%;box-shadow:0 12px 24px -10px rgba(224,36,94,.7)}
.main[disabled]{opacity:.6;cursor:wait}
.ghost{background:transparent;color:var(--acc);border:2px solid var(--acc);padding:10px 18px;font-weight:700}
.err{color:var(--acc);font-size:14px;min-height:1em;margin:0}
.out{display:grid;gap:12px;text-align:start;margin-top:22px;padding-top:22px;border-top:1.5px dashed var(--line)}
.out .bar{display:flex;gap:8px;flex-wrap:wrap}.out .bar>*{flex:1 1 140px}
.out a.ghost{text-decoration:none;text-align:center;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;min-height:44px}
.note{background:var(--bg);border-radius:16px;padding:14px 16px;font-size:14px;border:1.5px solid var(--line)}
.note b{color:var(--acc)}
.recap{background:var(--bg);border-radius:18px;padding:16px 18px;text-align:start;margin:16px 0;border:1.5px dashed var(--line)}
.recap div{display:flex;gap:10px;justify-content:space-between;padding:4px 0}.recap b{white-space:nowrap}.recap span{text-align:end}
#preview{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--card);font-size:14px;padding:8px 16px}
.fly,.pt,.spark,.poof{position:fixed;pointer-events:none;z-index:40}
.fly{bottom:-40px;animation:up linear forwards}
@keyframes up{to{transform:translateY(-115vh) rotate(var(--r));opacity:0}}
.pt{animation:pt .9s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes pt{to{transform:translate(var(--dx),var(--dy)) scale(.3) rotate(var(--r));opacity:0}}
.spark{width:8px;height:8px;margin:-4px 0 0 -4px;background:radial-gradient(circle,#fff 0 30%,#ff6b93 60%,transparent 70%);border-radius:50%;animation:sp .7s ease-out forwards}
@keyframes sp{to{transform:translateY(14px) scale(.2);opacity:0}}
@media(max-width:600px){.row{grid-template-columns:minmax(0,1fr)}.acts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){.heart,.fly,#amb i,#yes{animation:none}.screen.on{animation:none}}
</style>
</head>
<body>
<div id="amb" aria-hidden="true"></div>
<button id="preview" class="hide" type="button"></button>

<main class="card">

  <!-- Écran 0 : créer son invitation -->
  <section class="screen" id="s0">
    <svg class="heart" viewBox="0 0 200 180" aria-hidden="true">
      <defs><linearGradient id="g0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b93"/><stop offset="1" stop-color="#c8124a"/></linearGradient></defs>
      <ellipse cx="100" cy="170" rx="60" ry="7" fill="#c8124a" opacity=".15"/>
      <path d="M100 160C40 118 12 86 12 54 12 28 32 10 56 10c18 0 34 10 44 26C110 20 126 10 144 10c24 0 44 18 44 44 0 32-28 64-88 106z" fill="url(#g0)"/>
      <path d="M40 40c6-10 16-15 26-14" stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none" opacity=".55"/>
      <path d="M70 108l8-30 46-18-24 44z" fill="#fff"/><path d="M78 78l46-18-30 26z" fill="#ffd1de"/>
    </svg>
    <h1 data-t="cTitle"></h1>
    <p class="lead" data-t="cLead"></p>
    <form id="cf" novalidate>
      <fieldset><legend data-t="cLang"></legend>
        <div class="seg"><label><input type="radio" name="lang" value="fr" checked>Français</label><label><input type="radio" name="lang" value="en">English</label></div>
      </fieldset>
      <label class="f"><span data-t="cEmail"></span>
        <input type="email" id="cEmail" autocomplete="email" inputmode="email" placeholder="toi@gmail.com" required>
        <span class="small" data-t="cEmailHelp"></span>
      </label>
      <div class="row">
        <label class="f"><span data-t="cFrom"></span><input id="cFrom" autocomplete="given-name"></label>
        <label class="f"><span data-t="cTo"></span><input id="cTo"></label>
      </div>
      <fieldset><legend data-t="cTone"></legend>
        <div class="seg"><label><input type="radio" name="tone" value="love" checked><span data-t="tLove"></span></label><label><input type="radio" name="tone" value="friend"><span data-t="tFriend"></span></label></div>
      </fieldset>
      <label class="f"><span data-t="cPhrase"></span>
        <select id="cPhrase"></select>
        <textarea id="cCustom" class="hide" maxlength="160"></textarea>
      </label>
      <fieldset><legend data-t="cActs"></legend>
        <span class="small" data-t="cActsHelp"></span>
        <div class="acts" id="cActs" style="margin-top:10px"></div>
        <div class="add"><input id="cNew" maxlength="40" enterkeyhint="done"><button class="ghost" id="cAdd" type="button" data-t="cAdd"></button></div>
        <div class="chips" id="cChips"></div>
        <label class="chk"><input type="checkbox" id="cOther" checked><span data-t="cOther"></span></label>
      </fieldset>
      <p class="err" id="cErr" aria-live="polite"></p>
      <button class="main" type="submit" data-t="cMake"></button>
    </form>

    <div class="out hide" id="cOut">
      <label class="f"><span data-t="cLink"></span><input id="cLinkBox" readonly><span class="small" id="cUpd" aria-live="polite"></span></label>
      <div class="bar">
        <button class="ghost" id="cCopy" type="button" data-t="cCopy"></button>
        <a class="ghost" id="cWa" target="_blank" rel="noopener" data-t="cWa"></a>
        <button class="ghost" id="cPrev" type="button" data-t="cPrev"></button>
      </div>
      <div class="note"><span data-t="cAct"></span>
        <div class="bar" style="margin-top:10px"><button class="ghost" id="cActBtn" type="button" data-t="cActBtn"></button></div>
        <p class="err" id="cActMsg" aria-live="polite" style="margin-top:8px"></p>
      </div>
      <p class="small" style="text-align:center;margin:0">v4</p>
    </div>
  </section>

  <!-- Écran 1 : la question -->
  <section class="screen" id="s1">
    <svg class="heart" viewBox="0 0 200 180" aria-hidden="true">
      <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b93"/><stop offset="1" stop-color="#c8124a"/></linearGradient></defs>
      <ellipse cx="100" cy="170" rx="60" ry="7" fill="#c8124a" opacity=".15"/>
      <path d="M100 160C40 118 12 86 12 54 12 28 32 10 56 10c18 0 34 10 44 26C110 20 126 10 144 10c24 0 44 18 44 44 0 32-28 64-88 106z" fill="url(#g1)"/>
      <path d="M40 40c6-10 16-15 26-14" stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none" opacity=".55"/>
      <rect x="62" y="60" width="76" height="52" rx="6" fill="#fff"/>
      <path d="M62 64l38 28 38-28" stroke="#e0245e" stroke-width="4" fill="none" stroke-linejoin="round"/>
      <circle cx="100" cy="92" r="9" fill="#e0245e"/>
    </svg>
    <h1 id="q"></h1>
    <p class="lead" id="qLead"></p>
    <div class="btns">
      <button id="yes" type="button"></button>
      <button id="no" type="button"></button>
    </div>
    <p class="hint" id="hint" aria-live="polite"></p>
  </section>

  <!-- Écran 2 : le choix -->
  <section class="screen" id="s2">
    <h2 id="s2Title"></h2>
    <p class="lead" id="s2Lead"></p>
    <form id="f" novalidate>
      <label class="f"><span data-t="fName"></span><input id="name" autocomplete="given-name"></label>
      <div class="row">
        <label class="f"><span data-t="fDay"></span><input type="date" id="day" required></label>
        <label class="f"><span data-t="fHour"></span><input type="time" id="hour" value="19:00" required></label>
      </div>
      <fieldset><legend data-t="fAct"></legend>
        <div class="acts" id="acts"></div>
        <input id="other" class="hide" style="margin-top:10px">
      </fieldset>
      <label class="f"><span data-t="fMsg"></span><textarea id="msg"></textarea></label>
      <p class="err" id="err" aria-live="polite"></p>
      <button class="main" id="send" type="submit" data-t="fSend"></button>
    </form>
  </section>

  <!-- Écran 3 : confirmation -->
  <section class="screen" id="s3">
    <svg class="heart" viewBox="0 0 200 180" aria-hidden="true">
      <defs><linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b93"/><stop offset="1" stop-color="#c8124a"/></linearGradient></defs>
      <path d="M100 160C40 118 12 86 12 54 12 28 32 10 56 10c18 0 34 10 44 26C110 20 126 10 144 10c24 0 44 18 44 44 0 32-28 64-88 106z" fill="url(#g3)"/>
      <path d="M66 82l24 24 46-46" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <h2 id="doneTitle"></h2>
    <p class="lead" id="doneText"></p>
    <div class="recap" id="recap"></div>
    <p class="small" id="why"></p>
    <button class="ghost" id="again" type="button" hidden data-t="again"></button>
  </section>

</main>

<script>
{

const esc = s => String(s ?? "").replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));

const coarse = matchMedia("(pointer: coarse)").matches;

/* ---------- Textes FR / EN ---------- */

fr:{ cTitle:"Crée ton <em>invitation</em>", cLead:"Entre ton e-mail, génère ton lien et envoie-le. La réponse arrivera directement dans ta boîte, sans que ton adresse soit affichée.",

           friend:["On se fait une <em>sortie</em> ensemble ?","Ça te dit qu'on se retrouve pour un <em>bon moment</em> ?","J'ai une super idée : une <em>sortie</em>, toi et moi ?"]},

  from:f=>`— ${f}`, fName:"Ton prénom", fDay:"Le jour", fHour:"L'heure", fAct:"Ce qui te ferait plaisir", fOther:"Dis-moi ton idée…",

  dl:"fr-FR" },

  cLang:"Invitation language", cEmail:"Your email (to receive the answer)", cEmailHelp:"It is never shown in the invitation.",

const KEY = [...new TextEncoder().encode("rdv-coeur-2026-love")];
function pack(o){
  const b = new TextEncoder().encode(JSON.stringify(o)).map((x,i) => x ^ KEY[i % KEY.length] ^ (i*7 & 255));
  let s = ""; b.forEach(x => s += String.fromCharCode(x));
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function unpack(t){
  try{
    const s = atob(t.replace(/-/g,"+").replace(/_/g,"/"));
    const b = Uint8Array.from(s, (c,i) => c.charCodeAt(0) ^ KEY[i % KEY.length] ^ (i*7 & 255));
    return JSON.parse(new TextDecoder().decode(b));
  }catch{ return null; }
}

async function post(to, fields){
  if (!EMAIL_RE.test(to)) throw new Error("adresse invalide");
  let r;
  try {
    r = await fetch("https://formsubmit.co/ajax/" + to, {
      method:"POST", headers:{ "Content-Type":"application/json", "Accept":"application/json" },
      body: JSON.stringify(Object.assign({ _template:"table", _captcha:"false" }, fields))
    });
  } catch { throw new Error("network"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok || String(j.success) === "false") throw new Error(j.message || ("HTTP " + r.status));
}

function place(){
  const w = no.offsetWidth, h = no.offsetHeight, pad = 10, yr = yes.getBoundingClientRect();
  let x, y, best = null, bestD = -1;
  for (let i = 0; i < 40; i++){
    x = pad + Math.random() * Math.max(1, innerWidth - w - pad*2);
    y = pad + Math.random() * Math.max(1, innerHeight - h - pad*2);
    const onYes = x < yr.right+12 && x+w > yr.left-12 && y < yr.bottom+12 && y+h > yr.top-12;
    const d = Math.hypot(x + w/2 - pos.x, y + h/2 - pos.y);
    if (!onYes && d > bestD){ bestD = d; best = [x,y]; if (d > Math.min(innerWidth, innerHeight) * .55) break; }
  }
  if (best){ no.style.left = best[0] + "px"; no.style.top = best[1] + "px"; }
  no.classList.remove("blink"); void no.offsetWidth; if (!calm) no.classList.add("blink");
}
function flee(){
  if (!live()) return;

  }

const COLS = ["#e0245e","#ff6b93","#ffb3c8","#c8124a","#ffd166"];
function hearts(n){

function burst(x, y, n){

    const p = document.createElement("div"), a = Math.random()*Math.PI*2, d = 60 + Math.random()*140, s = 8 + Math.random()*14;
    p.className = "pt";

    p.innerHTML = i % 3 ? HEART(COLS[i % 5]) : `<svg viewBox="0 0 10 10" width="100%" height="100%"><path d="M5 0l1.2 3.8L10 5 6.2 6.2 5 10 3.8 6.2 0 5l3.8-1.2z" fill="${COLS[4]}"/></svg>`;
    document.body.appendChild(p); setTimeout(() => p.remove(), 1000);
  }
}
function poof(x, y){
  if (calm) return;
  for (let i = 0; i < 14; i++){
    const p = document.createElement("div"), a = i/14*Math.PI*2, s = 10;
    p.className = "pt";

}

function trail(e){
  if (calm) return;
  const now = performance.now(); if (now - lastSpark < 45) return; lastSpark = now;
  const s = document.createElement("div"); s.className = "spark";
  s.style.left = e.clientX + "px"; s.style.top = e.clientY + "px";
  document.body.appendChild(s); setTimeout(() => s.remove(), 750);
}
document.addEventListener("touchmove", e => trail(e.touches[0]), {passive:true});
/* Cœurs qui flottent doucement en fond */
if (!calm){
  $("amb").innerHTML = Array.from({length:14}, (_, i) => {
    const s = 18 + Math.random()*34;
    return `<i style="left:${Math.random()*100}%;width:${s}px;height:${s}px;--dx:${Math.random()*80-40}px;--r:${Math.random()*90-45}deg;animation-duration:${14+Math.random()*14}s;animation-delay:-${Math.random()*24}s">${HEART(COLS[i % 4])}</i>`;
  }).join("");
}

/* ---------- Démarrage : lien d'invitation ou écran de création ---------- */
const token = location.hash.slice(1);
const c = token ? unpack(token) : null;
if (c && c.e){ startInvite(c); }
else { applyStatic(); fillPhrases(); show("s0"); }
}
</script>
</body>
